name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: tools/dev/env/ci/deps.sh
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build
        env:
          # CodeQL sees only what is actually compiled; ccache hits would
          # hide translation units from it.
          CCACHE_DISABLE: "1"
        run: |
          cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_DEMOS=OFF -DWITH_DOCS=OFF
          cmake --build _build --parallel "$(nproc)"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
